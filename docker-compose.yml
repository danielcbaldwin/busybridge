services:
  calendar-sync:
    build:
      context: .
      network: host
    container_name: calendar-sync
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "8033:3000"
    environment:
      - DATABASE_PATH=/data/calendar-sync.db
      - ENCRYPTION_KEY_FILE=/secrets/encryption.key
      # Externally-reachable base URL.  Default matches the published
      # host port (8033) over plain HTTP for a local run; set PUBLIC_URL
      # to your real https:// origin in production — the session
      # cookie's Secure flag is derived from this scheme.
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:8033}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - TZ=America/New_York
      # TEST_MODE quick switch:
      # - Set TEST_MODE=true
      # - Fill both allowlists with dedicated Gmail test accounts
      # Optional cleanup marker prefix for BusyBridge-created events
      - ENABLE_WEBHOOKS=${ENABLE_WEBHOOKS:-true}
      - TEST_MODE=${TEST_MODE:-false}
      - TEST_MODE_ALLOWED_HOME_EMAILS=${TEST_MODE_ALLOWED_HOME_EMAILS:-}
      - TEST_MODE_ALLOWED_CLIENT_EMAILS=${TEST_MODE_ALLOWED_CLIENT_EMAILS:-}
      # Ghost Main: run without a real Google main calendar (SQLite ledger only).
      - MAIN_VIRTUAL=${MAIN_VIRTUAL:-false}
      # When True, Google eventType='outOfOffice' events are mirrored as
      # normal busy blocks.  Default False: OOO is a per-calendar status
      # signal and shouldn't block peer calendars.
      - SYNC_OUT_OF_OFFICE_EVENTS=${SYNC_OUT_OF_OFFICE_EVENTS:-false}
      # Per-event opt-out substring.  Any event whose description
      # contains this string (case-insensitive) is skipped at ingest.
      # Empty string disables the check.
      - SKIP_EVENT_DESCRIPTION_TAG=${SKIP_EVENT_DESCRIPTION_TAG:-[nosync]}
      - MANAGED_EVENT_PREFIX=${MANAGED_EVENT_PREFIX:-[BusyBridge]}
      # Busy-block titles (rendered on placeholder events on peer calendars).
      # Change either to override the default label; setting them to the
      # same value makes personal-source blocks indistinguishable from
      # client-source ones.
      - BUSY_BLOCK_TITLE=${BUSY_BLOCK_TITLE:-Busy}
      - PERSONAL_BUSY_BLOCK_TITLE=${PERSONAL_BUSY_BLOCK_TITLE:-Busy (personal)}
      # Phase-1 organizer-delete propagation: off (default) | shadow | on.
      # See DELETE_PROPAGATION_PLAN.md.
      - DELETE_PROPAGATION_MODE=${DELETE_PROPAGATION_MODE:-off}
      # Mirror all-day personal-calendar events as busy blocks. Default
      # false: all-day personal events are suppressed everywhere (they
      # only block out the whole day with no information). Set true to
      # restore the legacy full-day "Personal" busy blocks.
      - SYNC_PERSONAL_ALL_DAY_EVENTS=${SYNC_PERSONAL_ALL_DAY_EVENTS:-false}
      # Expired one-off events. Default true: an event past
      # EVENT_RETENTION_DAYS is RELEASED (left frozen on the calendars,
      # retired from sync) instead of deleted, so old history is kept.
      # Set false for the legacy behavior (delete the managed copies).
      - RELEASE_EXPIRED_EVENTS=${RELEASE_EXPIRED_EVENTS:-true}
    volumes:
      - ./data:/data
      - ./secrets:/secrets
      - ./backups:/data/backups
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
